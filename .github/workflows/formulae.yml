# Formula half of this tap's CI, the counterpart to casks.yml.
#
# Homebrew tests formulae with `brew test-bot`, the tool homebrew-core's own CI
# runs, rather than the cask matrix. Gated on `Formula/` so a cask pull request
# never pays for it, and so the cask matrix never sees a formula: it rejects any
# Ruby file outside `Casks/`.
#
# macOS only. The formulae here declare `depends_on :macos`, so a Linux runner
# would fail on a formula that cannot install there. Both architectures run,
# since a formula shipping separate Intel and Apple Silicon archives needs each
# one fetched and installed to be worth testing.

name: formulae

on:
  push:
    branches:
      - main
      - master
    paths:
      - Formula/**
      - .github/workflows/formulae.yml
  pull_request:
    paths:
      - Formula/**
      - .github/workflows/formulae.yml
  merge_group:
  workflow_dispatch:

concurrency:
  group: formulae-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-bot:
    name: brew test-bot (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'
