# Downstream of Homebrew's own tap template. Keep it in step rather than
# letting it drift into a private dialect, so this tap stays mergeable with
# upstream and inherits their fixes:
#
#   https://github.com/Homebrew/brew/blob/main/.github/workflows/tap-new-tests.yml
#
# For cask-specific behaviour the reference is homebrew-cask's own CI, which
# no longer uses a fixed matrix at all. It runs `brew generate-cask-ci-matrix`
# and derives the runners from the casks a pull request touches:
#
#   https://github.com/Homebrew/homebrew-cask/blob/main/.github/workflows/ci.yml
#
# Worth re-checking both whenever Homebrew changes its CI.

name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        # Matches the upstream template, which carries no Intel runner. Ours
        # had one, and it could not pay for itself: every cask here ships
        # aarch64-apple-darwin only, so an Intel machine cannot install one.
        #
        # It was not merely useless but actively flaky. `brew style` installs
        # shellcheck, whose dependency gmp had no x86_64 bottle, so the runner
        # fell back to building it from source and spent 21 and 27 minutes on
        # two separate pull requests timing out against gmplib.org.
        #
        # When this tap does ship an x86_64 cask, the upstream answer is not to
        # hardcode a runner back in here. It is `brew generate-cask-ci-matrix`,
        # which reads the arch a cask declares and schedules to match.
        os: [ ubuntu-24.04, macos-26 ]
    runs-on: ${{ matrix.os }}
    # A dead upstream mirror should fail in minutes, not hold a runner for half
    # an hour. A passing run here takes about two.
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Install bubblewrap (Linux sandbox)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
