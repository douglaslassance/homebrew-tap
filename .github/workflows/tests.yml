name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        # No Intel runner. Every cask in this tap ships aarch64-apple-darwin
        # only, so an Intel machine cannot install any of them and the job can
        # never catch anything. It also has no bottles cached for Homebrew's own
        # audit dependencies, so it starts compiling them and a syntax check
        # turns into a half-hour source build against third-party mirrors.
        #
        # This is what homebrew-cask itself now does: `brew
        # generate-cask-ci-matrix` picks runners from the casks a PR touches
        # rather than from a fixed list, and would pick these two for this tap.
        os: [ ubuntu-24.04, macos-26 ]
    runs-on: ${{ matrix.os }}
    # A dead upstream mirror should fail in minutes, not hold a runner for half
    # an hour. A passing run here takes about two.
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Install bubblewrap (Linux sandbox)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
